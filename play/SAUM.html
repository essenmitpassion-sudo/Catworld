<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee9dc" />
    <title>SAUM — Die wandernden Inseln</title>
    <meta
      name="description"
      content="Führe drei bewohnte Meeresriesen durch den Sturm. Ein kleines Strategiespiel über Schutz, Atem und gemeinsame Wege."
    />
  <style>:root {
  color-scheme: light;
  --paper: #eee9dc;
  --ink: #293f3e;
  --muted: #637269;
  --rust: #a85439;
  --line: #bfc3ae;
  --sea: #d5e3d9;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--ink);
  background: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background-image: radial-gradient(#65705d14 0.65px, transparent 0.8px);
  background-size: 5px 5px;
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.4;
}
button:focus-visible,
input:focus-visible,
[role="button"]:focus-visible {
  outline: 3px solid var(--rust);
  outline-offset: 5px;
}
button {
  touch-action: manipulation;
}
#app {
  max-width: 1600px;
  margin: auto;
  padding: 27px 38px 18px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 23px;
}
.brand h1 {
  font-size: 58px;
  line-height: 1;
  margin: 0;
  letter-spacing: 0.12em;
  font-weight: 400;
}
.brand p {
  font-size: 16px;
  line-height: 1.5;
  margin: 0;
  color: var(--muted);
  max-width: 190px;
}
.eyebrow,
.stat small,
.map-note,
.giant-name,
.reef text,
.storm text,
.raft text,
.route text,
.front-label,
.compass text,
.controls small,
.hint,
.legend,
footer,
.text-button,
.mode,
.roster button,
.course label,
.rules-body dt {
  font-family: ui-sans-serif, system-ui, sans-serif;
}
.eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  margin-bottom: 8px;
}
.voyage-stats {
  display: flex;
  align-items: center;
  gap: 30px;
}
.stat {
  font-size: 32px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stat span {
  font-size: 19px;
  color: var(--muted);
}
.stat small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.18em;
  margin-top: 4px;
}
.text-button {
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  padding: 6px 0;
  font-size: 12px;
}
.world {
  position: relative;
  margin: 2px -14px -6px;
}
#sea {
  width: 100%;
  display: block;
  touch-action: none;
  user-select: none;
}
.shore-shadow {
  fill: #d5e3d9;
  stroke: #a4ad99;
  stroke-width: 1.5;
  filter: drop-shadow(0 6px 0 #74836b0c);
}
.contours {
  fill: none;
  stroke: #648f832d;
  stroke-width: 1.2;
}
.ripples {
  fill: none;
  stroke: #5a8a7b;
  stroke-width: 1;
  opacity: 0.25;
}
.giant {
  cursor: grab;
}
.giant:active {
  cursor: grabbing;
}
.giant.sunk {
  opacity: 0.22;
  cursor: default;
}
.wake {
  fill: none;
  stroke: #f0f2df;
  stroke-width: 2.4;
  stroke-linecap: round;
}
.giant-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.03em;
  fill: #334c45;
  paint-order: stroke;
  stroke: #d5e3d9;
  stroke-width: 4px;
}
.selection-ring {
  fill: none;
  stroke: #a45b3d;
  stroke-width: 1.5;
  stroke-dasharray: 2 5;
}
.route {
  fill: none;
  stroke: #536d61;
  stroke-width: 1.6;
  stroke-dasharray: 4 5;
  opacity: 0.55;
}
.route.chosen {
  stroke: #355c58;
  stroke-width: 2;
  opacity: 1;
}
.route.danger {
  stroke: #ae4e37;
}
.route text {
  stroke: none;
  fill: #3b6159;
  font-size: 12px;
  letter-spacing: 0.04em;
  paint-order: stroke;
  stroke: #d5e3d9;
  stroke-width: 4px;
  stroke-dasharray: none;
}
.route.danger text {
  fill: #9b4432;
}
.route .destination {
  fill: #eee9dc;
  stroke-dasharray: none;
}
.route .shelter-area {
  stroke: #476f6a;
  stroke-dasharray: 2 7;
  stroke-width: 1;
  opacity: 0.55;
}
.reef text,
.storm text,
.raft text {
  font-size: 9px;
  letter-spacing: 0.1em;
  fill: #526e63;
  paint-order: stroke;
  stroke: #d5e3d9;
  stroke-width: 3px;
}
.storm.forecast text {
  fill: #9b5d44;
}
.sanctuary {
  fill: #667b5c;
  font-size: 25px;
  letter-spacing: 0.3em;
}
.front-next {
  stroke: #6a7c74;
  stroke-dasharray: 4 6;
  fill: none;
}
.front-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  fill: #516762;
}
.map-note {
  font-size: 9px;
  letter-spacing: 0.16em;
  fill: #60796c;
}
.scale {
  stroke: #688271;
  fill: none;
}
.compass text {
  font-size: 10px;
  fill: #536a5e;
}
.legend {
  position: absolute;
  bottom: 26px;
  left: 32px;
  display: flex;
  gap: 16px;
  font-size: 10px;
  color: #5a7266;
  pointer-events: none;
}
.legend i {
  display: inline-block;
  width: 18px;
  margin-right: 5px;
  border-top: 1px solid #55777a;
  vertical-align: middle;
}
.legend i.dash {
  border-top: 2px dashed #ac674f;
}
.legend i.dot {
  border-top: 2px dotted #53766d;
}
.report {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 9px 0 14px;
  border-bottom: 1px solid var(--line);
  min-height: 49px;
}
.report p {
  font-size: 16px;
  line-height: 1.4;
  margin: 0;
}
.report p.warning {
  color: #914e36;
}
.report .hint {
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  flex-shrink: 0;
}
.controls {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 19px 0 17px;
  min-height: 119px;
}
.roster {
  display: flex;
  gap: 5px;
}
.roster button {
  background: none;
  border: 1px solid transparent;
  border-radius: 50%;
  width: 46px;
  height: 46px;
  font-size: 14px;
  position: relative;
}
.roster button.current {
  border-color: var(--ink);
  background: #dce1d0;
}
.roster button::after {
  content: "";
  position: absolute;
  left: 13px;
  right: 13px;
  bottom: 6px;
  border-bottom: 2px solid #718476;
}
.controls .identity {
  min-width: 160px;
}
.identity h2 {
  font-size: 27px;
  font-weight: 400;
  margin: 0 0 5px;
}
.controls small {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.04em;
  line-height: 1.5;
}
.breath {
  display: flex;
  gap: 3px;
  margin: 8px 0 6px;
}
.breath b {
  width: 12px;
  height: 5px;
  background: #466b61;
}
.breath b.empty {
  background: #c9cbb9;
}
.modes {
  display: flex;
  align-items: stretch;
  border: 1px solid #a9b19e;
  padding: 3px;
  gap: 2px;
}
.mode {
  border: 0;
  background: none;
  padding: 11px 16px;
  font-size: 12px;
  text-align: left;
  min-width: 83px;
}
.mode strong {
  display: block;
  font-weight: 500;
  font-size: 13px;
}
.mode small {
  display: block;
  font-size: 9px;
  line-height: 1.6;
  white-space: nowrap;
}
.mode.active {
  background: #d5ddcb;
  box-shadow: inset 0 -2px #557264;
}
.course {
  flex: 1;
  min-width: 100px;
  max-width: 210px;
}
.course label {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 12px;
}
.course input {
  width: 100%;
  accent-color: #526c5c;
  cursor: ew-resize;
}
.tide-button {
  margin-left: auto;
  border: 1px solid #294a44;
  background: #35564f;
  color: #f4edda;
  padding: 17px 24px;
  min-width: 180px;
  text-align: left;
  box-shadow: 0 3px 0 #233d38;
}
.tide-button strong {
  display: block;
  font-size: 19px;
  font-weight: 400;
}
.tide-button small {
  color: #d1dece;
  display: block;
  margin-top: 5px;
  font-size: 9px;
  letter-spacing: 0.09em;
}
.tide-button:hover:not(:disabled) {
  background: #25463f;
  transform: translateY(-1px);
}
footer {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.footer-actions {
  display: flex;
  gap: 18px;
}
.footer-actions button {
  font-size: 10px;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #253f3a57;
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 5;
  padding: 20px;
}
.sheet {
  background: var(--paper);
  width: min(600px, 100%);
  padding: 40px 44px;
  box-shadow: 0 15px 80px #19312c3b;
  border: 1px solid #c1bda4;
  max-height: 92dvh;
  overflow: auto;
  position: relative;
}
.sheet .ornament {
  font-size: 33px;
  letter-spacing: 0.15em;
  color: #7a8a6c;
  margin: 0 0 20px;
}
.sheet h2 {
  font-size: 45px;
  font-weight: 400;
  line-height: 1.08;
  margin: 0 0 20px;
  letter-spacing: -0.02em;
}
.sheet .intro-text {
  font-size: 18px;
  line-height: 1.65;
  margin: 0 0 24px;
}
.sheet .instruction {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  line-height: 1.8;
  padding: 15px 0;
  border-block: 1px solid var(--line);
  margin: 23px 0;
}
.sheet .primary {
  display: block;
  width: 100%;
  padding: 15px;
  border: 1px solid #35564f;
  background: #35564f;
  color: #f3eddd;
  font-size: 18px;
}
.sheet .secondary {
  display: block;
  margin: 15px auto 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  padding: 6px;
}
.sheet .folio {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 0 18px;
}
.rules-body {
  line-height: 1.65;
  font-size: 15px;
}
.rules-body dt {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 18px;
}
.rules-body dd {
  margin: 5px 0 12px;
}
.key {
  font-family: ui-sans-serif, system-ui, sans-serif;
  border: 1px solid var(--line);
  padding: 1px 4px;
  font-size: 10px;
}
.mobile-help {
  display: none;
}
.busy #sea {
  cursor: wait;
}
.busy .giant {
  cursor: wait;
}
.seed-form {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 20px 0;
}
.seed-form label {
  font-size: 12px;
}
.seed-form input {
  min-width: 0;
  width: 100%;
  padding: 10px;
  background: #f6f0e2;
  border: 1px solid #a7ad97;
  color: var(--ink);
  font-size: 13px;
}
.end-stat {
  font-size: 45px;
  margin: 20px 0;
}
.end-stat span {
  font-size: 16px;
  color: var(--muted);
}
.status-fade {
  animation: report-in 0.4s ease-out;
}
@keyframes report-in {
  from {
    opacity: 0.3;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (min-width: 1450px) {
  #app {
    padding-inline: 60px;
  }
  .world {
    margin-top: -8px;
  }
}
@media (max-width: 1100px) {
  #app {
    padding: 22px 24px;
  }
  .brand h1 {
    font-size: 46px;
  }
  .controls {
    gap: 15px;
    flex-wrap: wrap;
  }
  .roster {
    gap: 0;
  }
  .controls .identity {
    min-width: 140px;
  }
  .mode {
    padding: 10px 12px;
    min-width: 70px;
  }
  .course {
    max-width: 155px;
  }
  .tide-button {
    min-width: 155px;
    padding: 15px 18px;
  }
  .report .hint {
    display: none;
  }
}
@media (max-width: 800px) {
  .brand p {
    font-size: 13px;
    max-width: 140px;
  }
  .voyage-stats {
    gap: 16px;
  }
  .stat {
    font-size: 26px;
  }
  .stat span {
    font-size: 15px;
  }
  .brand {
    gap: 16px;
  }
  .brand h1 {
    font-size: 40px;
  }
  .world {
    margin-top: 8px;
  }
  .controls {
    gap: 15px;
  }
  .roster {
    order: 0;
  }
  .identity {
    order: 1;
    flex: 1;
  }
  .modes {
    order: 3;
  }
  .course {
    order: 4;
    flex: 1;
    max-width: none;
  }
  .tide-button {
    order: 2;
  }
  .legend {
    bottom: 16px;
    left: 28px;
    gap: 9px;
    font-size: 8px;
  }
  .report p {
    font-size: 14px;
  }
  .eyebrow {
    font-size: 8px;
  }
  .report {
    min-height: 46px;
  }
  .controls .identity {
    min-width: 0;
  }
  .identity h2 {
    font-size: 23px;
  }
}
@media (max-width: 520px) {
  #app {
    padding: 17px 14px;
  }
  .brand p {
    display: none;
  }
  .brand h1 {
    font-size: 38px;
  }
  .voyage-stats {
    gap: 14px;
  }
  .stat {
    font-size: 23px;
  }
  .stat small {
    font-size: 8px;
  }
  .voyage-stats > .text-button {
    font-size: 10px;
  }
  .eyebrow {
    letter-spacing: 0.13em;
  }
  .brand {
    gap: 0;
  }
  header {
    gap: 10px;
    padding-bottom: 13px;
  }
  .world {
    margin: 7px -7px 0;
    overflow: hidden;
  }
  #sea {
    width: 100%;
    min-height: 310px;
    object-fit: contain;
  }
  .legend {
    display: none;
  }
  .controls {
    gap: 12px;
    padding-block: 14px;
  }
  .roster button {
    width: 35px;
    height: 35px;
    font-size: 12px;
  }
  .roster button::after {
    left: 11px;
    right: 11px;
    bottom: 3px;
  }
  .identity h2 {
    font-size: 22px;
  }
  .identity small {
    font-size: 9px;
  }
  .tide-button {
    min-width: 132px;
    padding: 13px 12px;
  }
  .tide-button strong {
    font-size: 16px;
  }
  .tide-button small {
    font-size: 8px;
  }
  .modes {
    flex: 1;
  }
  .mode {
    min-width: 0;
    flex: 1;
    padding: 9px 10px;
  }
  .mode strong {
    font-size: 12px;
  }
  .mode small {
    font-size: 8px;
  }
  .course {
    order: 5;
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .course label {
    min-width: 75px;
    margin: 0;
  }
  .course input {
    margin: 0;
  }
  .breath {
    gap: 2px;
    margin: 5px 0;
  }
  .breath b {
    width: 8px;
    height: 4px;
  }
  .report {
    padding-bottom: 10px;
  }
  .report p {
    font-size: 13px;
    line-height: 1.5;
  }
  footer {
    align-items: flex-start;
    gap: 8px;
    font-size: 8px;
  }
  footer > span {
    max-width: 150px;
    line-height: 1.7;
  }
  .footer-actions {
    gap: 12px;
  }
  .footer-actions button {
    font-size: 9px;
  }
  .sheet {
    padding: 27px 24px;
  }
  .sheet h2 {
    font-size: 35px;
  }
  .sheet .intro-text {
    font-size: 16px;
  }
  .sheet .instruction {
    font-size: 11px;
  }
  .sheet .ornament {
    margin-bottom: 15px;
  }
  .mobile-help {
    display: block;
    font-size: 10px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: var(--muted);
    text-align: center;
    margin: 0 0 10px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
/* The chart fits a desktop window; portrait mode follows the selected island. */
.map-view {
  display: none;
}
@media (min-width: 801px) {
  #sea {
    height: calc(100dvh - 355px);
    min-height: 430px;
    max-height: 850px;
  }
}
@media (max-width: 520px) {
  header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px;
  }
  .brand h1 {
    font-size: 34px;
  }
  .eyebrow {
    font-size: 7px;
    letter-spacing: 0.09em;
  }
  .voyage-stats {
    display: grid;
    grid-template-columns: auto auto;
    gap: 8px 14px;
  }
  .stat {
    font-size: 21px;
  }
  .stat small {
    font-size: 7px;
    letter-spacing: 0.08em;
  }
  .voyage-stats > .text-button {
    grid-column: 1/-1;
    justify-self: end;
    font-size: 10px;
    padding: 3px 0;
  }
  .world {
    margin-block: 12px 4px;
  }
  #sea {
    min-height: 0;
    height: auto;
    aspect-ratio: 12/7;
  }
  #sea.closeup {
    aspect-ratio: 6/7;
  }
  .map-view {
    display: block;
    position: absolute;
    right: 10px;
    top: 9px;
    border: 1px solid #91a28d;
    background: #eee9dce8;
    padding: 7px 9px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10px;
    color: #3e5a4d;
  }
  .controls {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 13px 16px;
  }
  .roster {
    grid-column: 1;
    grid-row: 1;
    align-self: start;
    gap: 0;
  }
  .roster button {
    flex-shrink: 0;
  }
  .identity {
    grid-column: 2;
    grid-row: 1;
  }
  .identity h2 {
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }
  .identity h2 small {
    font-size: 10px;
  }
  .identity > small {
    font-size: 9px;
  }
  .modes {
    grid-column: 1/-1;
    grid-row: 2;
  }
  .course {
    grid-column: 1/-1;
    grid-row: 3;
  }
  .tide-button {
    grid-column: 1/-1;
    grid-row: 4;
    width: 100%;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }
  .tide-button small {
    font-size: 7px;
  }
  .tide-button strong {
    font-size: 17px;
  }
  .mobile-help {
    margin-bottom: 9px;
  }
  .report {
    min-height: 53px;
  }
  .sheet .primary {
    font-size: 16px;
  }
}
.event-label {
  pointer-events: none;
  animation: report-in 0.5s ease-out;
}
.event-label text {
  font:
    600 12px ui-sans-serif,
    system-ui,
    sans-serif;
  fill: #365b45;
  paint-order: stroke;
  stroke: #edf0dc;
  stroke-width: 5px;
  stroke-linejoin: round;
}
.event-damage text {
  fill: #9e4933;
