name: UDIFlow
targets:
  UDIFlowTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '15.0'
    sources: [UDIFlowTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stream.soundweave.udi.flowtests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  UDIFlow:
    build:
      targets:
        UDIFlowTests: [test]
    test:
      targets: [UDIFlowTests]
      gatherCoverageData: false
