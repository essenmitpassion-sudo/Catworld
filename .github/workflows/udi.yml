name: UDI CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run test:layout
      - run: npm run native:prepare
      - run: npm run native:check
