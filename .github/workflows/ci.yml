name: VERSATZ checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run simulate
      - run: npm run smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run smoke:counterplay
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run smoke:active
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run smoke:motion
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: VERSATZ-playable-and-evidence
          path: |
            dist/VERSATZ.html
            docs/playtest-current.json
            docs/browser-results.json
            work/browser-results.json
            work/counterplay-browser.json
            docs/intelligence.json
            docs/tactical-cases.json
            docs/endgames-v2.json
            docs/phase2-comparison.json
            docs/phase2-tactics.json
            work/phase2/active-browser.json
            work/phase2/motion-feedback.json
            work/phase2/winning-feedback.png
            work/phase2/active-direction-mobile.png
          retention-days: 7
