name: VERSATZ checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run simulate
      - run: npm run smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: VERSATZ-playable-and-evidence
          path: |
            dist/VERSATZ.html
            docs/playtest.json
            docs/browser-results.json
            work/browser-results.json
          retention-days: 30
