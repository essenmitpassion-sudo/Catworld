name: UDI native builds
on:
  push:
    branches: [development/udi]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/native.yml'

permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # Standard runners are free for this verified public repository. Never
    # silently begin metered private-repository builds if visibility changes.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run native:prepare
      - run: npm run native:check
      - name: Compile Android debug APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          if ! (cd android && ./gradlew --no-daemon assembleDebug) > "$RUNNER_TEMP/udi-android-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/udi-android-build.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/udi-android-build.log"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Compile iOS simulator app without signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          xcodebuild -version
          if ! xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/udi-ios" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/udi-ios-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/udi-ios-build.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/udi-ios-build.log"
          test -d "$RUNNER_TEMP/udi-ios/Build/Products/Debug-iphonesimulator/App.app"
          shasum -a 256 "$RUNNER_TEMP/udi-ios/Build/Products/Debug-iphonesimulator/App.app/App"
      # Deliberately no artifact upload, release, signing account or deployment.
